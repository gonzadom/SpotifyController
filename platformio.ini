; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200 #Permite que los mensajes de debug se muestren bien
lib_deps =
    lvgl/lvgl@^9.2.2
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git #Este si funciona, la solucion la encontre en un comentario del articulo de donde saque el cogido
	TFT_eSPI
	bblanchon/ArduinoJson@^7.2.1
	bodmer/TJpg_Decoder@^1.1.0
	#XPT2046_Touchscreen 
	#Este no funciona, begin no toma el argumento touchscreenSPI
build_flags =
	; LVGL toma la configuracion de include/lv_conf.h
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	; Configuracion de TFT_eSPI para la CYD (ESP32-2432S028R), asi no depende del User_Setup.h de la libreria
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D USE_HSPI_PORT=1
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
